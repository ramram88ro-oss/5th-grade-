<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رحلة جدول الضرب - الصف الخامس</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Tahoma", "Arial", sans-serif;
    background: #fff4cf;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
  }
  .page {
    position: relative;
    width: min(100vw, 900px);
    aspect-ratio: 1086 / 1536;
    max-height: 100vh;
    background: url("data:image/png;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTL[...]
    overflow: hidden;
  }
  .start-hit {
    position: absolute;
    top: 4.7%;
    right: 6.5%;
    width: 32%;
    height: 8%;
    border: 0;
    background: transparent;
    cursor: pointer;
    z-index: 20;
  }
  .game-area {
    position: absolute;
    top: 24.5%;
    left: 10%;
    width: 80%;
    height: 61%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.6%;
    color: #2d2a24;
  }
  .status {
    width: 92%;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    font-weight: 700;
    font-size: clamp(14px, 2.2vw, 23px);
  }
  .pill {
    background: rgba(255,255,255,.80);
    border: 2px solid #e9a32f;
    border-radius: 999px;
    padding: 7px 14px;
    box-shadow: 0 2px 5px rgba(120,80,20,.12);
  }
  .question-card {
    width: 92%;
    min-height: 28%;
    background: rgba(255,255,255,.78);
    border: 3px solid #eca732;
    border-radius: 24px;
    padding: 12px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 18px rgba(120,80,20,.10);
  }
  .table-label {
    font-size: clamp(14px, 2vw, 22px);
    color: #0d9aa2;
    font-weight: 700;
  }
  .question {
    font-size: clamp(34px, 6vw, 64px);
    font-weight: 900;
    color: #e8841a;
    margin-top: 5px;
  }
  .answers {
    width: 92%;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .answer {
    border: 3px solid #0d9aa2;
    background: rgba(255,255,255,.88);
    border-radius: 18px;
    padding: 12px 8px;
    font-size: clamp(22px, 4vw, 34px);
    font-weight: 900;
    color: #116f74;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s, background .15s;
  }
  .answer:hover { transform: translateY(-2px); box-shadow: 0 5px 12px rgba(0,0,0,.12); }
  .answer:disabled { cursor: default; opacity: .92; }
  .correct { background: #d8f6df !important; border-color: #2d9a49 !important; color: #207337 !important; }
  .wrong { background: #ffe0e0 !important; border-color: #d45b5b !important; color: #a33b3b !important; }
  .feedback {
    min-height: 42px;
    font-weight: 900;
    font-size: clamp(16px, 2.8vw, 26px);
    text-align: center;
  }
  .progress {
    width: 92%;
    height: 13px;
    background: rgba(255,255,255,.72);
    border-radius: 99px;
    overflow: hidden;
    border: 1px solid #e9a32f;
  }
  .bar { height: 100%; width: 0%; background: #0d9aa2; transition: width .25s; }
  .controls {
    display: flex;
    gap: 10px;
    margin-top: 4px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .control {
    border: 0;
    border-radius: 999px;
    padding: 10px 18px;
    background: #ef9d2f;
    color: white;
    font-size: clamp(14px, 2.4vw, 21px);
    font-weight: 800;
    cursor: pointer;
  }
  .secondary { background: #0d9aa2; }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(255,247,216,.93);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 10%;
    text-align: center;
  }
  .result {
    width: min(90%, 650px);
    background: white;
    border: 4px solid #e9a32f;
    border-radius: 28px;
    padding: 28px 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,.15);
  }
  .result h2 { color: #0d9aa2; font-size: clamp(28px, 5vw, 48px); margin: 5px 0 12px; }
  .result p { font-size: clamp(18px, 3vw, 27px); margin: 8px 0; }
  .hidden { display: none !important; }
  @media (max-width: 600px) {
    .game-area { top: 25%; height: 58%; }
    .answers { gap: 8px; }
    .answer { padding: 9px 5px; }
    .status { width: 95%; }
  }
</style>
</head>
<body>
<div class="page" aria-label="قالب رحلة جدول الضرب">
  <button class="start-hit" id="startHit" aria-label="ابدأ اللعبة"></button>

  <div class="game-area">
    <div class="status">
      <div class="pill">🏆 النقاط: <span id="score">0</span></div>
      <div class="pill">⭐ السؤال: <span id="qNum">0</span>/10</div>
      <div class="pill">⏱️ الوقت: <span id="time">20</span> ث</div>
    </div>

    <div class="progress"><div class="bar" id="bar"></div></div>

    <div class="question-card">
      <div class="table-label" id="tableLabel">رحلة جداول الضرب ٢–٩</div>
      <div class="question" id="question">اضغط «ابدأ اللعبة»</div>
      <div class="feedback" id="feedback">ثم اختر الإجابة الصحيحة!</div>
    </div>

    <div class="answers" id="answers">
      <button class="answer" disabled>؟</button>
      <button class="answer" disabled>؟</button>
      <button class="answer" disabled>؟</button>
      <button class="answer" disabled>؟</button>
    </div>

    <div class="controls">
      <button class="control" id="nextBtn">السؤال التالي ➜</button>
      <button class="control secondary" id="restartBtn">إعادة اللعبة ↻</button>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="result">
      <h2>🎉 أحسنت يا بطل!</h2>
      <p id="finalScore"></p>
      <p id="finalMsg"></p>
      <button class="control" id="againBtn">العب من جديد</button>
    </div>
  </div>
</div>

<script>
const TOTAL = 10;
const TIME_LIMIT = 20;
let score = 0, questionNo = 0, correctAnswer = 0, timeLeft = TIME_LIMIT;
let timer = null, locked = true;

const $ = id => document.getElementById(id);
const arabicDigits = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);

function randomQuestion() {
  const a = Math.floor(Math.random()*8) + 2;   // 2..9
  const b = Math.floor(Math.random()*10) + 1;  // 1..10
  correctAnswer = a*b;
  $("tableLabel").textContent = `جدول ${arabicDigits(a)} × تذكّر: هيا نفكر!`;
  $("question").textContent = `${arabicDigits(a)} × ${arabicDigits(b)} = ؟`;

  const opts = new Set([correctAnswer]);
  while (opts.size < 4) {
    let candidate = correctAnswer + (Math.floor(Math.random()*11)-5);
    if (candidate > 0 && candidate !== correctAnswer) opts.add(candidate);
  }
  const arr = [...opts].sort(() => Math.random()-0.5);
  document.querySelectorAll(".answer").forEach((btn, i) => {
    btn.disabled = false; btn.className = "answer";
    btn.textContent = arabicDigits(arr[i]);
    btn.dataset.value = arr[i];
  });

  $("feedback").textContent = "اختر الإجابة الصحيحة";
  $("feedback").style.color = "#2d2a24";
  $("qNum").textContent = arabicDigits(questionNo);
  $("bar").style.width = `${(questionNo/TOTAL)*100}%`;

  timeLeft = TIME_LIMIT;
  $("time").textContent = arabicDigits(timeLeft);
  clearInterval(timer);
  timer = setInterval(() => {
    timeLeft--;
    $("time").textContent = arabicDigits(Math.max(timeLeft,0));
    if (timeLeft <= 0) {
      clearInterval(timer);
      lockQuestion(false, true);
    }
  }, 1000);
}

function lockQuestion(correct, timeout=false) {
  locked = true;
  clearInterval(timer);
  document.querySelectorAll(".answer").forEach(btn => {
    btn.disabled = true;
    if (Number(btn.dataset.value) === correctAnswer) btn.classList.add("correct");
  });
  if (correct) {
    score += 10;
    $("score").textContent = arabicDigits(score);
    $("feedback").textContent = "✅ إجابة صحيحة! +١٠ نقاط";
    $("feedback").style.color = "#207337";
  } else if (timeout) {
    $("feedback").textContent = `⏰ انتهى الوقت! الإجابة هي ${arabicDigits(correctAnswer)}`;
    $("feedback").style.color = "#a33b3b";
  } else {
    $("feedback").textContent = `❌ ليست الإجابة الصحيحة. الإجابة هي ${arabicDigits(correctAnswer)}`;
    $("feedback").style.color = "#a33b3b";
  }
  $("bar").style.width = `${(questionNo/TOTAL)*100}%`;
}

function choose(btn) {
  if (locked) return;
  const value = Number(btn.dataset.value);
  if (value === correctAnswer) {
    btn.classList.add("correct");
    lockQuestion(true);
  } else {
    btn.classList.add("wrong");
    lockQuestion(false);
  }
}

function nextQuestion() {
  if (questionNo >= TOTAL) { showResult(); return; }
  questionNo++;
  locked = false;
  randomQuestion();
}

function startGame() {
  score = 0; questionNo = 0;
  $("score").textContent = "٠";
  $("overlay").style.display = "none";
  nextQuestion();
}

function showResult() {
  clearInterval(timer);
  $("bar").style.width = "100%";
  $("finalScore").textContent = `نتيجتك: ${arabicDigits(score)} من ${arabicDigits(TOTAL*10)}`;
  let msg = score >= 90 ? "ممتاز جدًا! أنت بطل جداول الضرب 🌟" :
            score >= 70 ? "عمل رائع! واصل التدريب لتصبح أسرع 💪" :
            "بداية جميلة! جرّب مرة أخرى وتعلّم من أخطائك 📚";
  $("finalMsg").textContent = msg;
  $("overlay").style.display = "flex";
}

document.querySelectorAll(".answer").forEach(btn => btn.addEventListener("click", () => choose(btn)));
$("nextBtn").addEventListener("click", () => {
  if (!locked) lockQuestion(false);
  if (questionNo < TOTAL) nextQuestion();
  else showResult();
});
$("restartBtn").addEventListener("click", startGame);
$("againBtn").addEventListener("click", startGame);
$("startHit").addEventListener("click", startGame);

document.querySelectorAll(".answer").forEach(btn => btn.disabled = true);
</script>
</body>
</html>
